name: Setup
description: Install Bun and the locked dependencies

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # renovate: datasource=github-releases depName=oven-sh/bun
        bun-version: 1.4.4
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
